[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smmregrid"
dynamic = ["version"]
authors = [
  { name="Jost von Hardenberg", email="jost.hardenberg@polito.it" },
  { name="Paolo Davini", email="paolo.davini@cnr.it" },
  { name="Scott Wales", email="scott.wales@unimelb.edu.au"}
]
description = "Regridding based on sparse matrix multiplication"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    'numpy',
    'xarray',
    'dask',
    'netcdf4',
    'cfgrib',
    'sparse',
    'numba',
    'cfunits'
]

[project.optional-dependencies]
tests = [
    "cdo",
    "coverage>=7.6.1",
    "coveralls",
    "pytest",
    "pytest-timeout",
    "pytest-xdist",
    "pytest-cov",
    "distributed"
]

docs = [
    "sphinx<7.0",
    "sphinx-rtd-theme"
]

notebooks = [
    "ipykernel",
    "matplotlib",
    "jinja2"
]

all = [
    "smmregrid[tests,notebooks,docs]"
]

[project.urls]
"Homepage" = "https://github.com/jhardenberg/smmregrid"
"Documentation" = "https://smmregrid.readthedocs.io"
"Bug Tracker" = "https://github.com/jhardenberg/smmregrid/issues"
"Repository" = "https://github.com/jhardenberg/smmregrid"
"Changelog" = "https://github.com/jhardenberg/smmregrid/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["smmregrid"]

[tool.setuptools.dynamic]
version = {attr = "smmregrid.__version__"}

[tool.pytest.ini_options]
# two workers by default; loadgroup keeps the distributed and GRIB tests on a single worker each
addopts = ["-v", "--tb=short", "--timeout=300", "--timeout-method=thread", "-n", "2", "--dist", "loadgroup"]

[tool.coverage.run]
source = ["smmregrid"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
ignore_errors = true