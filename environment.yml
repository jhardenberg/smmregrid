# Create a suitable environment with micromamba:
# micromamba env create -f environment.yml
# The sel(linux) selector is supported by micromamba, not conda/mamba.

name : smmregrid
channels:
  - conda-forge
dependencies:
  - python>=3.8,<3.15
  - ecCodes
  - numba
  - sel(linux): cdo>=2.5.0,<2.6.1
  - pip
  - pip:
    - -e .[all]
