# This workflow will install Python dependencies using Conda, run tests and lint with a single version of Python
# For more information see: https://autobencoder.com/2020-08-24-conda-actions/

name: Mamba PyTest

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1" #run every Monday night at 1AM UTC

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.8", "3.14", "3.15"]
        #python-version: ["3.14"]
        os: [ubuntu-latest, macos-latest]
        include:
          # Linux gets CDO from conda-forge
          - os: ubuntu-latest
            environment-file: environment.yml
          # macOS gets CDO from Homebrew, as conda-forge has no recent builds
          - os: macos-latest
            environment-file: environment-macos.yml
          # coverage is measured and uploaded only once, on Linux with the newest Python
          - os: ubuntu-latest
            python-version: "3.15"
            coverage: true
    defaults:
      run:
        shell: bash -el {0}
    steps:
    - uses: actions/checkout@v6
    - name: Install CDO with Homebrew
      if: runner.os == 'macOS'
      run: |
        brew install cdo
        echo "CDO=$(brew --prefix)/bin/cdo" >> $GITHUB_ENV
    - name: provision-with-micromamba
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-file: ${{ matrix.environment-file }}
        environment-name: smmregrid
        cache-downloads: true
        cache-environment: false
        condarc: |
          channels:
            - conda-forge
        create-args: >-
              python=${{ matrix.python-version }}
    - name: Install smmregrid
      run: |
        # install package
        python -m pip install --editable .
        ${CDO:-cdo} --version
    - name: Lint with flake8
      run: |
        # install flake8
        python -m pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run tests
      if: ${{ !matrix.coverage }}
      run: |
        python -m pytest
    - name: Run tests with coverage
      if: ${{ matrix.coverage }}
      run: |
        python -m pip install coverage
        coverage run -m pytest
        coverage lcov
    - name: Run coveralls
      if: ${{ matrix.coverage }}
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: coverage.lcov

